services:
  rag-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multimodal-rag-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=false
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - UPLOAD_DIR=/app/data/uploads
      - EXTRACTED_IMAGES_DIR=/app/data/extracted_images
    volumes:
      - chroma_data:/app/chroma_db
      - upload_data:/app/data/uploads
      - image_data:/app/data/extracted_images
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M

volumes:
  chroma_data:
    driver: local
  upload_data:
    driver: local
  image_data:
    driver: local
