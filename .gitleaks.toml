# Gitleaks configuration for secret detection
title = "Multi-Modal RAG Secret Detection Policy"

[extend]
useDefault = true

[allowlist]
description = "Ignore synthetic mock keys in test files and documentation"
paths = [
  '''^\.env\.example$''',
  '''^tests/.*''',
  '''^plan\.md$''',
  '''^README\.md$''',
  '''^CODEBASE_GUIDE\.md$'''
]
regexes = [
  '''your_gemini_api_key.*''',
  '''your_openai_api_key.*''',
  '''valid-mock-api-key.*'''
]
