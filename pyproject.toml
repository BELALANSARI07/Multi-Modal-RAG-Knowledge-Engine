[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-rag-engine"
version = "1.1.0"
description = "Production-grade Multi-Modal Retrieval-Augmented Generation (RAG) Knowledge Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Belal Ansari", email = "belalansari000078@gmail.com" }
]
keywords = [
    "rag",
    "multimodal",
    "fastapi",
    "chromadb",
    "vision-language-models",
    "embeddings",
    "vector-search"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    "PyMuPDF>=1.24.0",
    "Pillow>=10.4.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "onnxruntime>=1.14.0",
    "google-generativeai>=0.8.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0"
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    "chroma_db",
    "data",
    "venv",
    ".venv"
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:asyncio -p no:anyio -v"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning"
]
